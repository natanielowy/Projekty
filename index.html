<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MusicBox 1.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background: #0f0f13; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; touch-action: manipulation; }
    .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card { background: rgba(255, 255, 255, 0.05); transition: all 0.2s ease; }
    .glass-card:active { background: rgba(255, 255, 255, 0.15); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden relative">

  <!-- Ekran Logowania -->
  <div id="auth-screen" class="absolute inset-0 z-50 bg-[#0f0f13] flex items-center justify-center p-4">
    <div class="glass p-6 sm:p-8 rounded-2xl w-full max-w-sm border border-white/10 space-y-6 shadow-2xl">
      <div class="text-center space-y-2">
        <i class="fa-solid fa-compact-disc text-4xl text-indigo-500"></i>
        <h2 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-pink-500 bg-clip-text text-transparent">MusicBox Mobile</h2>
        <p class="text-xs text-gray-400">Zaloguj się do swojego serwera</p>
      </div>
      <div class="space-y-4">
        <div>
          <label class="text-xs text-gray-400 block mb-1">Nazwa użytkownika</label>
          <input type="text" id="auth-user" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="text-xs text-gray-400 block mb-1">Hasło</label>
          <input type="password" id="auth-pass" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>
        <p id="auth-error" class="text-xs text-red-400 text-center h-4"></p>
        <div class="flex gap-3 pt-2">
          <button onclick="handleLogin()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl text-xs font-medium transition-all shadow-lg shadow-indigo-600/30">Zaloguj</button>
          <button onclick="handleRegister()" class="flex-1 bg-white/10 hover:bg-white/20 py-3 rounded-xl text-xs font-medium transition-all">Rejestracja</button>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio-element" preload="auto"></audio>

  <!-- Układ główny -->
  <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
    <!-- Desktop Sidebar (Widoczny tylko na ekranach md+) -->
    <div class="hidden md:flex w-64 glass flex-col justify-between p-4 z-10">
      <div>
        <div class="flex items-center gap-3 px-2 py-4 mb-4">
          <i class="fa-solid fa-compact-disc text-3xl text-indigo-500"></i>
          <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-pink-500 bg-clip-text text-transparent">MusicBox</h1>
        </div>
        <nav class="space-y-1">
          <button onclick="switchTab('search')" id="nav-desktop-search" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg bg-indigo-600/30 text-indigo-400 font-medium text-sm">
            <i class="fa-solid fa-magnifying-glass text-lg"></i> Wyszukaj
          </button>
          <button onclick="switchTab('queue')" id="nav-desktop-queue" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white font-medium text-sm">
            <i class="fa-solid fa-list-ol text-lg"></i> Kolejka
          </button>
          <button onclick="switchTab('playlists')" id="nav-desktop-playlists" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white font-medium text-sm">
            <i class="fa-solid fa-folder-plus text-lg"></i> Playlisty
          </button>
        </nav>
      </div>
      <div class="p-2 border-t border-white/10 flex items-center justify-between">
        <span id="logged-username-desktop" class="text-xs text-gray-400 truncate"></span>
        <button onclick="logoutUser()" title="Wyloguj" class="text-xs text-gray-400 hover:text-red-400 p-1"><i class="fa-solid fa-right-from-bracket"></i></button>
        <button onclick="switchTab('settings')" id="nav-desktop-settings" class="p-2 text-gray-400 hover:text-white text-sm">
          <i class="fa-solid fa-gear"></i>
        </button>
      </div>
    </div>

    <!-- Zawartość Główna -->
    <div class="flex-1 flex flex-col overflow-hidden bg-gradient-to-b from-indigo-950/20 to-transparent">
      <!-- Pasek wyszukiwania widoczny TYLKO w zakładce Wyszukaj -->
      <div id="search-bar-container" class="p-4 sm:p-6 pb-2">
        <div class="relative w-full max-w-xl mx-auto">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input type="text" id="search-input" placeholder="Szukaj lub wklej token playlisty (pl_...)..." class="w-full bg-white/5 border border-white/10 rounded-full py-3 pl-11 pr-4 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-indigo-500 transition-all" onkeypress="if(event.key === 'Enter') window.handleSearch()">
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-4 sm:p-6 pt-2 pb-28 md:pb-6">
        <!-- Wyszukaj -->
        <div id="tab-search" class="space-y-4">
          <h2 class="text-base sm:text-lg font-semibold text-gray-300 mb-2">Wyniki wyszukiwania</h2>
          <div id="search-results" class="space-y-2">
            <p class="text-xs sm:text-sm text-gray-500">Wpisz frazę lub token playlisty powyżej...</p>
          </div>
        </div>

        <!-- Kolejka -->
        <div id="tab-queue" class="hidden space-y-4">
          <div class="flex items-center justify-between mb-2">
            <h2 class="text-base sm:text-lg font-semibold text-gray-300">Odtwarzane i Kolejka</h2>
            <button onclick="clearQueue()" class="text-xs text-gray-400 hover:text-red-400">Wyczyść kolejkę</button>
          </div>
          <div id="queue-list" class="space-y-2"></div>
        </div>

        <!-- Playlisty -->
        <div id="tab-playlists" class="hidden space-y-4 max-w-5xl">
          <div class="flex items-center justify-between">
            <h2 class="text-base sm:text-lg font-semibold text-gray-300">Twoje Playlisty</h2>
            <button onclick="openCreatePlaylistModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-xl text-xs font-medium flex items-center gap-1.5 shadow-lg shadow-indigo-600/30">
              <i class="fa-solid fa-plus"></i> Nowa
            </button>
          </div>
          <div id="user-playlists" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
          
          <div id="playlist-view" class="hidden space-y-4 pt-2 border-t border-white/10">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <button onclick="backToPlaylistsList()" class="text-xs text-indigo-400 hover:underline mb-1 flex items-center gap-1"><i class="fa-solid fa-arrow-left"></i> Powrót do playlist</button>
                <h3 id="view-pl-title" class="text-lg font-bold text-white truncate">Nazwa</h3>
              </div>
              <div class="flex flex-wrap gap-2">
                <button onclick="playEntirePlaylist()" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-2 rounded-xl text-xs"><i class="fa-solid fa-play"></i> Odtwórz</button>
                <button id="btn-save-shared-pl" onclick="saveSharedPlaylistToLibrary()" class="hidden bg-emerald-600 hover:bg-emerald-500 px-3 py-2 rounded-xl text-xs"><i class="fa-solid fa-bookmark"></i> Zapisz</button>
                <button id="btn-edit-pl" onclick="openEditPlaylistModal()" class="bg-white/10 hover:bg-white/20 px-3 py-2 rounded-xl text-xs"><i class="fa-solid fa-gear"></i> Edytuj</button>
                <button id="btn-delete-pl" onclick="deleteActivePlaylist()" class="bg-red-600/20 hover:bg-red-600/40 text-red-400 px-3 py-2 rounded-xl text-xs border border-red-500/30"><i class="fa-solid fa-trash"></i> Usuń</button>
              </div>
            </div>
            <div id="view-pl-tracks" class="space-y-2"></div>
          </div>
        </div>

        <!-- Ustawienia -->
        <div id="tab-settings" class="hidden space-y-6 max-w-2xl">
          <div class="flex items-center justify-between">
            <h2 class="text-base sm:text-lg font-semibold text-gray-300">Ustawienia</h2>
            <button onclick="logoutUser()" class="md:hidden text-xs text-red-400 border border-red-500/30 px-3 py-1.5 rounded-xl"><i class="fa-solid fa-right-from-bracket"></i> Wyloguj się</button>
          </div>
          <div class="glass p-4 sm:p-6 rounded-2xl border border-white/10 space-y-4">
            <div class="flex items-center justify-between">
              <div>
                <h3 class="text-xs sm:text-sm font-medium text-gray-200 flex items-center gap-2">
                  <i class="fa-brands fa-discord text-indigo-400"></i> Status Discord RPC
                </h3>
                <p class="text-[10px] sm:text-xs text-gray-400">Wyłącz, jeśli nie używasz na PC</p>
              </div>
              <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="discord-toggle" onchange="toggleDiscordIntegration(this.checked)" class="sr-only peer">
                <div class="w-11 h-6 bg-white/10 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Uniwersalny Modal -->
  <div id="custom-modal" class="fixed inset-0 z-50 bg-black/80 hidden flex items-center justify-center p-4">
    <div class="glass p-5 rounded-2xl w-full max-w-sm border border-white/10 space-y-4">
      <h3 id="modal-title" class="text-base font-semibold text-white">Tytuł</h3>
      <div id="modal-body" class="space-y-3 max-h-80 overflow-y-auto"></div>
      <div class="flex justify-end gap-3 pt-2">
        <button onclick="closeModal()" class="bg-white/10 hover:bg-white/25 px-4 py-2 rounded-xl text-xs font-medium">Zamknij</button>
        <button id="modal-submit" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl text-xs font-medium shadow-lg shadow-indigo-600/30">Zapisz</button>
      </div>
    </div>
  </div>

  <!-- Menu kontekstowe 3 kropek -->
  <div id="context-menu" class="hidden absolute z-40 glass p-2 rounded-xl border border-white/10 shadow-xl space-y-1 w-48 text-xs">
    <button onclick="ctxAddQueue()" class="w-full text-left px-3 py-2 rounded hover:bg-white/10 flex items-center gap-2"><i class="fa-solid fa-list-ul"></i> Dodaj do kolejki</button>
    <button onclick="ctxOpenPlaylistPicker()" class="w-full text-left px-3 py-2 rounded hover:bg-white/10 flex items-center gap-2"><i class="fa-solid fa-folder-plus"></i> Dodaj do playlisty</button>
  </div>

  <!-- Dolny Odtwarzacz Responsive -->
  <div class="fixed bottom-14 md:bottom-0 left-0 right-0 h-16 md:h-24 glass border-t border-white/10 px-3 md:px-6 flex items-center justify-between z-20">
    <div class="flex items-center gap-3 w-3/5 md:w-1/3 min-w-0">
      <div id="current-thumb" class="w-10 h-10 md:w-14 md:h-14 bg-white/5 rounded-lg overflow-hidden flex items-center justify-center border border-white/10 flex-shrink-0">
        <i class="fa-solid fa-music text-gray-500 text-base md:text-xl"></i>
      </div>
      <div class="overflow-hidden min-w-0">
        <h4 id="current-title" class="font-medium text-xs md:text-sm truncate">MusicBox Mobile</h4>
        <p id="current-artist" class="text-[10px] md:text-xs text-gray-400 truncate">Wybierz utwór</p>
      </div>
    </div>

    <!-- Sterowanie odtwarzaniem -->
    <div class="flex flex-col items-center justify-center gap-1 w-2/5 md:w-1/3">
      <div class="flex items-center gap-3 md:gap-6">
        <button onclick="playPrev()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-backward-step text-sm md:text-lg"></i></button>
        <button onclick="togglePlay()" id="play-btn" class="w-8 h-8 md:w-10 md:h-10 bg-indigo-600 hover:bg-indigo-500 rounded-full flex items-center justify-center text-white shadow-lg shadow-indigo-600/30">
          <i class="fa-solid fa-play text-xs md:text-sm"></i>
        </button>
        <button onclick="playNext()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-forward-step text-sm md:text-lg"></i></button>
      </div>
      <div class="hidden md:flex w-full items-center gap-3">
        <span id="time-current" class="text-[10px] text-gray-400 w-8 text-right">0:00</span>
        <input type="range" id="progress-bar" min="0" max="100" value="0" oninput="seekTo(this.value)" class="w-full h-1 bg-white/10 rounded-lg appearance-none cursor-pointer accent-indigo-500">
        <span id="time-total" class="text-[10px] text-gray-400 w-8">0:00</span>
      </div>
    </div>

    <!-- Głośność na PC -->
    <div class="hidden md:flex items-center justify-end gap-3 w-1/3">
      <i class="fa-solid fa-volume-high text-gray-400 text-xs"></i>
      <input type="range" id="volume-bar" min="0" max="100" value="80" oninput="setVolume(this.value)" class="w-24 h-1 bg-white/10 rounded-lg appearance-none cursor-pointer accent-indigo-500">
    </div>
  </div>

  <!-- Mobilny Nawigator Dolny -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 h-14 bg-[#0f0f13]/95 backdrop-blur-lg border-t border-white/10 flex items-center justify-around z-30 px-2">
    <button onclick="switchTab('search')" id="nav-mobile-search" class="flex flex-col items-center gap-1 text-indigo-400">
      <i class="fa-solid fa-magnifying-glass text-base"></i>
      <span class="text-[10px] font-medium">Szukaj</span>
    </button>
    <button onclick="switchTab('queue')" id="nav-mobile-queue" class="flex flex-col items-center gap-1 text-gray-400">
      <i class="fa-solid fa-list-ol text-base"></i>
      <span class="text-[10px] font-medium">Kolejka</span>
    </button>
    <button onclick="switchTab('playlists')" id="nav-mobile-playlists" class="flex flex-col items-center gap-1 text-gray-400">
      <i class="fa-solid fa-folder-plus text-base"></i>
      <span class="text-[10px] font-medium">Playlisty</span>
    </button>
    <button onclick="switchTab('settings')" id="nav-mobile-settings" class="flex flex-col items-center gap-1 text-gray-400">
      <i class="fa-solid fa-gear text-base"></i>
      <span class="text-[10px] font-medium">Opcje</span>
    </button>
  </div>

  <script>
    // Wykrywanie środowiska Electron (PC)
    let ipcRenderer = null;
    try {
      if (window.require) {
        ipcRenderer = window.require('electron').ipcRenderer;
      }
    } catch(e) {}

    // Domyślny adres awaryjny
    let SERVER_URL = ""; 
    let currentUser = null;
    let userPlaylists = [];
    let queue = [];
    let currentIndex = -1;
    let searchResultsList = [];
    let activePlaylistView = null;
    let ctxTargetTrack = null;
    let viewingSharedPlaylist = null;

    let audio = document.getElementById('audio-element');
    let discordEnabled = localStorage.getItem('discordEnabled') === 'true';
    document.getElementById('discord-toggle').checked = discordEnabled;

    // Dynamiczne pobieranie aktualnego tunelu Pinggy z Firebase Realtime Database
    async function fetchServerUrl() {
      try {
        const response = await fetch("https://musicbox-da2e0-default-rtdb.europe-west1.firebasedatabase.app/musicboxUrl.json");
        const data = await response.json();
        
        let rawUrl = "";
        if (typeof data === 'string') {
          rawUrl = data;
        } else if (typeof data === 'object' && data !== null) {
          rawUrl = data.url || Object.values(data)[0] || '';
        }

        let cleanUrl = String(rawUrl).replace(/["']/g, '').trim().replace(/\/+$/, '');
        if (cleanUrl) {
          SERVER_URL = /^https?:\/\//i.test(cleanUrl) ? cleanUrl : `https://${cleanUrl}`;
          console.log("Pobrano aktywny URL serwera z Firebase:", SERVER_URL);
        }
      } catch (e) {
        console.error("Błąd podczas pobierania adresu z Firebase:", e);
      }
      checkSavedUserSession();
    }

    if (ipcRenderer) {
      ipcRenderer.on('server-url-loaded', (event, url) => {
        SERVER_URL = String(url).trim().replace(/\/+$/, '');
        checkSavedUserSession();
      });
    } else {
      fetchServerUrl();
    }

    function checkSavedUserSession() {
      const savedUser = localStorage.getItem('musicbox_user');
      if (savedUser) {
        try {
          currentUser = JSON.parse(savedUser);
          initApp();
        } catch (e) {
          localStorage.removeItem('musicbox_user');
        }
      }
    }

    audio.addEventListener('play', () => updatePlayBtnIcon(true));
    audio.addEventListener('pause', () => updatePlayBtnIcon(false));
    audio.addEventListener('ended', () => playNext());
    audio.addEventListener('timeupdate', updateProgress);

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
        e.preventDefault();
        togglePlay();
      }
    });

    function updatePlayBtnIcon(isPlaying) {
      const btn = document.getElementById('play-btn');
      btn.innerHTML = isPlaying ? '<i class="fa-solid fa-pause text-xs md:text-sm"></i>' : '<i class="fa-solid fa-play text-xs md:text-sm"></i>';
    }

    function updateProgress() {
      if (audio.duration) {
        const bar = document.getElementById('progress-bar');
        if (bar) bar.value = (audio.currentTime / audio.duration) * 100;
        const cur = document.getElementById('time-current');
        const tot = document.getElementById('time-total');
        if (cur) cur.innerText = formatTime(audio.currentTime);
        if (tot) tot.innerText = formatTime(audio.duration);
      }
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    async function handleLogin() {
      const username = document.getElementById('auth-user').value.trim();
      const password = document.getElementById('auth-pass').value.trim();
      if (!username || !password) return errAuth('Wypełnij pola');
      if (!SERVER_URL) return errAuth('Brak połączenia z serwerem. Odśwież stronę.');
      try {
        const res = await fetch(`${SERVER_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          currentUser = data.user;
          localStorage.setItem('musicbox_user', JSON.stringify(currentUser));
          initApp();
        } else { errAuth(data.error); }
      } catch (e) { errAuth('Błąd połączenia z serwerem'); }
    }

    async function handleRegister() {
      const username = document.getElementById('auth-user').value.trim();
      const password = document.getElementById('auth-pass').value.trim();
      if (!username || !password) return errAuth('Wypełnij pola');
      if (!SERVER_URL) return errAuth('Brak połączenia z serwerem. Odśwież stronę.');
      try {
        const res = await fetch(`${SERVER_URL}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          currentUser = data.user;
          localStorage.setItem('musicbox_user', JSON.stringify(currentUser));
          initApp();
        } else { errAuth(data.error); }
      } catch (e) { errAuth('Błąd połączenia z serwerem'); }
    }

    function logoutUser() {
      localStorage.removeItem('musicbox_user');
      currentUser = null;
      document.getElementById('auth-screen').classList.remove('hidden');
      if (ipcRenderer && discordEnabled) ipcRenderer.send('destroy-discord-rpc');
    }

    function errAuth(msg) { document.getElementById('auth-error').innerText = msg; }

    function initApp() {
      document.getElementById('auth-screen').classList.add('hidden');
      const deskUser = document.getElementById('logged-username-desktop');
      if (deskUser) deskUser.innerText = currentUser.username;
      loadPlaylists();
      if (ipcRenderer && discordEnabled) ipcRenderer.send('update-discord-status', null);
    }

    async function loadPlaylists() {
      try {
        const res = await fetch(`${SERVER_URL}/api/playlists?userId=${currentUser.id}`);
        const data = await res.json();
        if (data.success) { userPlaylists = data.playlists; renderPlaylists(); }
      } catch (e) {}
    }

    window.toggleDiscordIntegration = function(isEnabled) {
      discordEnabled = isEnabled;
      localStorage.setItem('discordEnabled', isEnabled);
      if (ipcRenderer) {
        if (!isEnabled) {
          ipcRenderer.send('destroy-discord-rpc');
        } else {
          ipcRenderer.send('update-discord-status', currentIndex !== -1 ? queue[currentIndex] : null);
        }
      }
    };

    window.handleSearch = async function() {
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;
      const resultsContainer = document.getElementById('search-results');
      resultsContainer.innerHTML = '<p class="text-xs sm:text-sm text-gray-400 animate-pulse">Wyszukiwanie na serwerze...</p>';

      try {
        if (query.startsWith('pl_')) {
          const res = await fetch(`${SERVER_URL}/api/playlists/search?q=${encodeURIComponent(query)}`);
          const data = await res.json();
          if (data.success && data.playlists.length > 0) {
            viewingSharedPlaylist = data.playlists[0];
            resultsContainer.innerHTML = `
              <div class="glass-card p-4 rounded-xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                <div>
                  <h4 class="font-bold text-white text-sm sm:text-base">${viewingSharedPlaylist.name}</h4>
                  <p class="text-xs text-gray-400">Udostępniona playlista (${viewingSharedPlaylist.tracks.length} utworów)</p>
                </div>
                <div class="flex gap-2 w-full sm:w-auto">
                  <button onclick='previewSharedPlaylist()' class="flex-1 sm:flex-initial bg-indigo-600 px-3 py-2 rounded-xl text-xs">Podejrzyj</button>
                  <button onclick='saveSharedPlaylistToLibrary()' class="flex-1 sm:flex-initial bg-emerald-600 px-3 py-2 rounded-xl text-xs">Zapisz</button>
                </div>
              </div>`;
            return;
          }
        }

        const res = await fetch(`${SERVER_URL}/api/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();
        searchResultsList = Array.isArray(data) ? data : [data];
        renderSearchResults();
      } catch (err) {
        resultsContainer.innerHTML = `<p class="text-xs sm:text-sm text-red-400">Błąd wyszukiwania: ${err.message}</p>`;
      }
    };

    window.previewSharedPlaylist = () => {
      if (!viewingSharedPlaylist) return;
      activePlaylistView = viewingSharedPlaylist;
      document.getElementById('tab-search').classList.add('hidden');
      document.getElementById('tab-playlists').classList.remove('hidden');
      document.getElementById('user-playlists').classList.add('hidden');
      document.getElementById('playlist-view').classList.remove('hidden');
      document.getElementById('view-pl-title').innerText = activePlaylistView.name + " (Kopia)";
      document.getElementById('btn-save-shared-pl').classList.remove('hidden');
      document.getElementById('btn-edit-pl').classList.add('hidden');
      document.getElementById('btn-delete-pl').classList.add('hidden');

      const container = document.getElementById('view-pl-tracks');
      container.innerHTML = activePlaylistView.tracks.map((t, idx) => `
        <div class="glass-card p-2.5 sm:p-3 rounded-xl flex items-center justify-between border border-white/5">
          <div class="flex items-center gap-3 flex-1 cursor-pointer min-w-0" onclick="playPlaylistTrackShared(${idx})">
            <span class="text-xs text-gray-500 w-4">${idx + 1}</span>
            <img src="${t.thumb || ''}" class="w-10 h-10 rounded object-cover bg-white/5 flex-shrink-0">
            <div class="min-w-0 flex-1">
              <p class="font-medium text-xs sm:text-sm text-white truncate">${t.title}</p>
              <p class="text-[10px] sm:text-xs text-gray-400 truncate">${t.artist}</p>
            </div>
          </div>
        </div>
      `).join('') || '<p class="text-xs text-gray-500">Brak utworów w playliście.</p>';
    };

    window.playPlaylistTrackShared = (idx) => {
      queue = queue.concat(activePlaylistView.tracks);
      playTrack(queue.length - activePlaylistView.tracks.length + idx);
    };

    window.saveSharedPlaylistToLibrary = async () => {
      if (!viewingSharedPlaylist && !activePlaylistView) return;
      const targetPl = viewingSharedPlaylist || activePlaylistView;
      try {
        await fetch(`${SERVER_URL}/api/playlists`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: currentUser.id,
            name: targetPl.name + ' (Kopia)',
            privacy: 'private',
            tracks: targetPl.tracks
          })
        });
        loadPlaylists();
        switchTab('playlists');
      } catch (e) {}
    };

    function renderSearchResults() {
      const container = document.getElementById('search-results');
      if (searchResultsList.length === 0) {
        container.innerHTML = '<p class="text-xs sm:text-sm text-gray-500">Brak wyników.</p>';
        return;
      }
      container.innerHTML = searchResultsList.map((item, idx) => `
        <div class="glass-card p-2.5 sm:p-3 rounded-xl flex items-center justify-between border border-white/5 gap-2">
          <div class="flex items-center gap-3 flex-1 cursor-pointer min-w-0" onclick="playSelectedSearch(${idx})">
            <img src="${item.thumb || ''}" class="w-10 h-10 sm:w-12 sm:h-12 rounded-lg object-cover bg-white/5 flex-shrink-0">
            <div class="min-w-0 flex-1">
              <p class="font-medium text-xs sm:text-sm text-white truncate">${item.title}</p>
              <p class="text-[10px] sm:text-xs text-gray-400 truncate">${item.artist || 'Wykonawca'}</p>
            </div>
          </div>
          <button onclick="openContextMenu(event, ${idx})" class="w-8 h-8 sm:w-9 sm:h-9 bg-white/5 hover:bg-white/10 rounded-lg flex items-center justify-center text-gray-300 flex-shrink-0"><i class="fa-solid fa-ellipsis-vertical text-xs"></i></button>
        </div>
      `).join('');
    }

    window.openContextMenu = (e, idx) => {
      e.stopPropagation();
      ctxTargetTrack = searchResultsList[idx];
      const menu = document.getElementById('context-menu');
      menu.style.top = `${Math.min(e.clientY, window.innerHeight - 100)}px`;
      menu.style.left = `${Math.min(e.clientX - 160, window.innerWidth - 180)}px`;
      menu.classList.remove('hidden');
    };

    window.addEventListener('click', () => { document.getElementById('context-menu').classList.add('hidden'); });

    window.ctxAddQueue = () => {
      if (ctxTargetTrack) {
        queue.push(ctxTargetTrack);
        renderQueue();
      }
    };

    window.ctxOpenPlaylistPicker = () => {
      if (!ctxTargetTrack) return;
      const modal = document.getElementById('custom-modal');
      document.getElementById('modal-title').innerText = 'Wybierz playlistę';
      document.getElementById('modal-body').innerHTML = userPlaylists.map(pl => `
        <div onclick="addTrackToPlaylistCheck(${pl.id})" class="glass-card p-3 rounded-xl cursor-pointer hover:bg-white/10">
          <p class="font-medium text-xs sm:text-sm text-white">${pl.name}</p>
        </div>
      `).join('') || '<p class="text-xs text-gray-400">Brak playlist. Stwórz jakąś!</p>';
      document.getElementById('modal-submit').classList.add('hidden');
      modal.classList.remove('hidden');
    };

    window.addTrackToPlaylistCheck = async (plId) => {
      const pl = userPlaylists.find(p => p.id === plId);
      if (!pl || !ctxTargetTrack) return;

      const exists = pl.tracks.some(t => (t.id && t.id === ctxTargetTrack.id));
      if (exists) {
        const modal = document.getElementById('custom-modal');
        document.getElementById('modal-title').innerText = 'Utwór już istnieje';
        document.getElementById('modal-body').innerHTML = `<p class="text-xs text-gray-300">Ten utwór znajduje się już na playliście "${pl.name}".</p>`;
        document.getElementById('modal-submit').classList.remove('hidden');
        document.getElementById('modal-submit').innerText = 'Dodaj mimo to';
        document.getElementById('modal-submit').onclick = async () => {
          pl.tracks.push(ctxTargetTrack);
          await savePlaylistServer(pl);
          closeModal();
        };
        return;
      }

      pl.tracks.push(ctxTargetTrack);
      await savePlaylistServer(pl);
      closeModal();
    };

    async function savePlaylistServer(pl) {
      await fetch(`${SERVER_URL}/api/playlists/${pl.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: pl.name, privacy: pl.privacy, tracks: pl.tracks })
      });
      loadPlaylists();
    }

    window.playSelectedSearch = (idx) => {
      queue.push(searchResultsList[idx]);
      currentIndex = queue.length - 1;
      playTrack(currentIndex);
    };

    window.playTrack = (idx) => {
      if (idx < 0 || idx >= queue.length) return;
      currentIndex = idx;
      const track = queue[idx];
      document.getElementById('current-title').innerText = track.title;
      document.getElementById('current-artist').innerText = track.artist || '';
      document.getElementById('current-thumb').innerHTML = track.thumb ? `<img src="${track.thumb}" class="w-full h-full object-cover rounded-lg">` : '<i class="fa-solid fa-music text-gray-500 text-base md:text-xl"></i>';

      const audioUrl = track.id ? `${SERVER_URL}/api/stream?id=${encodeURIComponent(track.id)}` : track.url;
      audio.src = audioUrl;
      audio.play().catch(e => {});
      renderQueue();
      if (ipcRenderer && discordEnabled) ipcRenderer.send('update-discord-status', track);
    };

    function renderPlaylists() {
      const container = document.getElementById('user-playlists');
      container.innerHTML = userPlaylists.map(pl => `
        <div class="glass-card p-3.5 sm:p-4 rounded-xl border border-white/5 flex flex-col justify-between cursor-pointer" onclick="viewPlaylist(${pl.id})">
          <div>
            <h4 class="font-medium text-xs sm:text-sm text-white truncate">${pl.name}</h4>
            <p class="text-[10px] sm:text-xs text-gray-400 mt-1">${pl.tracks.length} utworów · ${pl.privacy === 'public' ? 'Publiczna' : 'Prywatna'}</p>
          </div>
          <p class="text-[10px] text-indigo-400 mt-2.5 select-all">Token: ${pl.share_token}</p>
        </div>
      `).join('');
    }

    window.viewPlaylist = (plId) => {
      activePlaylistView = userPlaylists.find(p => p.id === plId);
      if (!activePlaylistView) return;
      document.getElementById('user-playlists').classList.add('hidden');
      document.getElementById('playlist-view').classList.remove('hidden');
      document.getElementById('view-pl-title').innerText = activePlaylistView.name;
      document.getElementById('btn-save-shared-pl').classList.add('hidden');
      document.getElementById('btn-edit-pl').classList.remove('hidden');
      document.getElementById('btn-delete-pl').classList.remove('hidden');
      
      const container = document.getElementById('view-pl-tracks');
      container.innerHTML = activePlaylistView.tracks.map((t, idx) => `
        <div class="glass-card p-2.5 sm:p-3 rounded-xl flex items-center justify-between border border-white/5 gap-2">
          <div class="flex items-center gap-3 flex-1 cursor-pointer min-w-0" onclick="playPlaylistTrack(${idx})">
            <span class="text-xs text-gray-500 w-4">${idx + 1}</span>
            <img src="${t.thumb || ''}" class="w-9 h-9 sm:w-10 sm:h-10 rounded object-cover bg-white/5 flex-shrink-0">
            <div class="min-w-0 flex-1">
              <p class="font-medium text-xs sm:text-sm text-white truncate">${t.title}</p>
              <p class="text-[10px] sm:text-xs text-gray-400 truncate">${t.artist}</p>
            </div>
          </div>
          <button onclick="removeTrackFromActivePlaylist(${idx})" class="text-red-400 hover:text-red-300 text-xs p-2 flex-shrink-0"><i class="fa-solid fa-trash"></i></button>
        </div>
      `).join('') || '<p class="text-xs text-gray-500">Brak utworów w tej playliście.</p>';
    };

    window.deleteActivePlaylist = async () => {
      if (!activePlaylistView) return;
      try {
        await fetch(`${SERVER_URL}/api/playlists/${activePlaylistView.id}`, { method: 'DELETE' });
        backToPlaylistsList();
        loadPlaylists();
      } catch (e) {}
    };

    window.backToPlaylistsList = () => {
      activePlaylistView = null;
      viewingSharedPlaylist = null;
      document.getElementById('playlist-view').classList.add('hidden');
      document.getElementById('user-playlists').classList.remove('hidden');
    };

    window.playEntirePlaylist = () => {
      if (!activePlaylistView || activePlaylistView.tracks.length === 0) return;
      queue = queue.concat(activePlaylistView.tracks);
      playTrack(queue.length - activePlaylistView.tracks.length);
    };

    window.playPlaylistTrack = (idx) => {
      queue = queue.concat(activePlaylistView.tracks);
      playTrack(queue.length - activePlaylistView.tracks.length + idx);
    };

    window.removeTrackFromActivePlaylist = async (idx) => {
      if (!activePlaylistView) return;
      activePlaylistView.tracks.splice(idx, 1);
      await savePlaylistServer(activePlaylistView);
      viewPlaylist(activePlaylistView.id);
    };

    window.openCreatePlaylistModal = () => {
      const modal = document.getElementById('custom-modal');
      document.getElementById('modal-title').innerText = 'Nowa Playlista';
      document.getElementById('modal-body').innerHTML = `
        <input type="text" id="new-pl-name" placeholder="Nazwa playlisty..." class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white">
        <select id="new-pl-privacy" class="w-full bg-[#18181b] border border-white/10 rounded-xl px-4 py-3 text-sm text-white">
          <option value="private">Prywatna (dostępna przez token)</option>
          <option value="public">Publiczna</option>
        </select>
      `;
      document.getElementById('modal-submit').classList.remove('hidden');
      document.getElementById('modal-submit').innerText = 'Utwórz';
      document.getElementById('modal-submit').onclick = async () => {
        const name = document.getElementById('new-pl-name').value.trim();
        const privacy = document.getElementById('new-pl-privacy').value;
        if (!name) return;
        await fetch(`${SERVER_URL}/api/playlists`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: currentUser.id, name, privacy, tracks: [] })
        });
        closeModal();
        loadPlaylists();
      };
      modal.classList.remove('hidden');
    };

    window.openEditPlaylistModal = () => {
      if (!activePlaylistView) return;
      const modal = document.getElementById('custom-modal');
      document.getElementById('modal-title').innerText = 'Edytuj playlistę';
      document.getElementById('modal-body').innerHTML = `
        <input type="text" id="edit-pl-name" value="${activePlaylistView.name}" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white">
        <select id="edit-pl-privacy" class="w-full bg-[#18181b] border border-white/10 rounded-xl px-4 py-3 text-sm text-white">
          <option value="private" ${activePlaylistView.privacy === 'private' ? 'selected' : ''}>Prywatna</option>
          <option value="public" ${activePlaylistView.privacy === 'public' ? 'selected' : ''}>Publiczna</option>
        </select>
      `;
      document.getElementById('modal-submit').classList.remove('hidden');
      document.getElementById('modal-submit').innerText = 'Zapisz';
      document.getElementById('modal-submit').onclick = async () => {
        activePlaylistView.name = document.getElementById('edit-pl-name').value.trim();
        activePlaylistView.privacy = document.getElementById('edit-pl-privacy').value;
        await savePlaylistServer(activePlaylistView);
        closeModal();
        viewPlaylist(activePlaylistView.id);
      };
      modal.classList.remove('hidden');
    };

    window.closeModal = () => { document.getElementById('custom-modal').classList.add('hidden'); };

    window.switchTab = function(tab) {
      ['search', 'queue', 'playlists', 'settings'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== tab);
        
        const dBtn = document.getElementById(`nav-desktop-${t}`);
        if (dBtn) {
          dBtn.className = t === tab 
            ? "w-full flex items-center gap-3 px-3 py-2.5 rounded-lg bg-indigo-600/30 text-indigo-400 font-medium text-sm"
            : "w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-gray-400 hover:text-white font-medium text-sm";
        }
        
        const mBtn = document.getElementById(`nav-mobile-${t}`);
        if (mBtn) {
          mBtn.className = t === tab 
            ? "flex flex-col items-center gap-1 text-indigo-400"
            : "flex flex-col items-center gap-1 text-gray-400";
        }
      });
      document.getElementById('search-bar-container').classList.toggle('hidden', tab !== 'search');
    };

    window.renderQueue = function() {
      const container = document.getElementById('queue-list');
      if (queue.length === 0) {
        container.innerHTML = '<p class="text-xs sm:text-sm text-gray-500">Kolejka jest pusta.</p>';
        return;
      }
      container.innerHTML = queue.map((item, idx) => `
        <div onclick="playTrack(${idx})" class="p-2.5 sm:p-3 rounded-lg ${idx === currentIndex ? 'bg-indigo-600/20 border border-indigo-500/40' : 'glass-card'} flex items-center justify-between cursor-pointer gap-2">
          <div class="flex items-center gap-3 min-w-0 flex-1">
            <img src="${item.thumb || ''}" class="w-9 h-9 sm:w-10 sm:h-10 rounded object-cover bg-white/5 flex-shrink-0">
            <div class="min-w-0 flex-1">
              <p class="font-medium text-xs sm:text-sm ${idx === currentIndex ? 'text-indigo-400' : 'text-white'} truncate">${item.title}</p>
              <p class="text-[10px] sm:text-xs text-gray-400 truncate">${item.artist || 'Wykonawca'}</p>
            </div>
          </div>
          ${idx === currentIndex ? '<i class="fa-solid fa-volume-high text-indigo-400 text-xs"></i>' : ''}
        </div>
      `).join('');
    };

    window.clearQueue = function() {
      queue = [];
      currentIndex = -1;
      audio.pause();
      audio.src = '';
      document.getElementById('current-title').innerText = 'MusicBox Mobile';
      document.getElementById('current-artist').innerText = 'Wybierz utwór';
      document.getElementById('current-thumb').innerHTML = '<i class="fa-solid fa-music text-gray-500 text-base md:text-xl"></i>';
      renderQueue();
      if (ipcRenderer && discordEnabled) ipcRenderer.send('update-discord-status', null);
    };

    window.togglePlay = () => {
      if (currentIndex === -1 && queue.length > 0) { playTrack(0); return; }
      if (currentIndex === -1) return;
      if (audio.paused) { audio.play().catch(e => {}); } else { audio.pause(); }
    };
    window.setVolume = (v) => { audio.volume = v / 100; };
    window.seekTo = (v) => { if (audio.duration) audio.currentTime = (v / 100) * audio.duration; };
    window.playNext = () => { if (currentIndex + 1 < queue.length) playTrack(currentIndex + 1); };
    window.playPrev = () => { if (currentIndex - 1 >= 0) playTrack(currentIndex - 1); };
  </script>
</body>
</html>
